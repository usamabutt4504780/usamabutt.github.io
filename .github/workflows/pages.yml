name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nextjs-portfolio/package-lock.json
      - name: Install dependencies
        working-directory: nextjs-portfolio
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        working-directory: nextjs-portfolio
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: nextjs-portfolio/out
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
